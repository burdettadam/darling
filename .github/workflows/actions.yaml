# CI branch only: replace .github/workflows/actions.yaml on
# ci/1388-sudo-qualification. Keep this workflow out of the upstream fix.
name: Sudo 1388 qualification

on:
  push:
    branches: [ci/1388-sudo-qualification]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character production commit to qualify
        required: true
        type: string
      components:
        description: Normal Darling component profile to build and install
        type: choice
        default: cli
        options: [cli, stock]

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: ${{ inputs.source_sha || '95bd9b12fb2f402fc3a3fc31872d35558a603169' }}
  BASE_SHA: c97ed9e7d4aaacb307acfd109c9b6cad77dc0016
  REVIEWED_SHA: ef4769e5a168aec4a07bdd68bfa070b2430d302a
  GIT_LFS_SKIP_SMUDGE: '1'
  QUALIFICATION_HELPER: |
    #!/usr/bin/env python3
    """Helpers for the isolated sudo qualification workflow, not product code."""

    import email.parser
    import os
    from pathlib import Path
    import re
    import signal
    import subprocess
    import sys


    def select_debs(directory):
        """Select CLI runtime packages and their local Darling dependencies."""
        packages = {}
        for path in sorted(Path(directory).rglob("*.deb")):
            control = subprocess.check_output(["dpkg-deb", "--field", str(path)], text=True)
            fields = email.parser.Parser().parsestr(control)
            if fields["Architecture"] not in ("all", "amd64"):
                continue
            name = fields["Package"]
            if name in packages:
                raise SystemExit(f"Multiple candidate packages for {name}")
            packages[name] = (path, fields)
        selected = set()
        pending = ["darling-core-native", "darling-core", "darling-system", "darling-cli"]
        while pending:
            name = pending.pop()
            if name in selected:
                continue
            if name not in packages:
                raise SystemExit(f"Pinned artifact is missing required package {name}")
            selected.add(name)
            _, fields = packages[name]
            dependencies = fields.get("Depends", "") + "," + fields.get("Pre-Depends", "")
            for group in dependencies.split(","):
                # The local packages have simple dependencies. Include any Darling
                # alternative from this same artifact; apt checks version constraints.
                for alternative in group.split("|"):
                    match = re.match(r"\s*([a-z0-9][a-z0-9+.-]*)", alternative)
                    if match and match[1].startswith("darling"):
                        pending.append(match[1])
        for name in sorted(selected):
            path, fields = packages[name]
            print(f"Runtime: {name} {fields['Version']} {fields['Architecture']}", file=sys.stderr)
            sys.stdout.buffer.write(os.fsencode(path.resolve()) + b"\0")


    def run_with_timeout(log, seconds, command):
        """Bound a native macOS subprocess and its own children, with no timeout dependency."""
        with open(log, "wb") as output:
            process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=output,
                                       stderr=subprocess.STDOUT, start_new_session=True)
            try:
                return process.wait(timeout=int(seconds))
            except subprocess.TimeoutExpired:
                os.killpg(process.pid, signal.SIGKILL)
                process.wait()
                return 124


    def report_suite(label, logfile, status):
        text = Path(logfile).read_text(errors="replace")
        lines = text.splitlines()
        passes = [line for line in lines if line.startswith("PASS: ")]
        failures = [line for line in lines if line.startswith("FAIL: ")]
        summaries = re.findall(r"(?m)^(\d+) checks, (\d+) failures$", text)
        status = int(status)
        if not summaries:
            raise SystemExit(f"{label}: suite did not complete; status={status}")
        checks, failed = map(int, summaries[-1])
        if checks != len(passes) + len(failures) or failed != len(failures) or checks == 0:
            raise SystemExit(f"{label}: inconsistent test accounting")
        if "PASS: ordinary command" not in passes:
            raise SystemExit(f"{label}: basic execution failed; not a valid before/after comparison")
        if label == "baseline":
            required = ("FAIL: single assignment (", "FAIL: HOME assignment from issue 1388 (")
            good = status == 1 and all(any(line.startswith(prefix) for line in failures)
                                       for prefix in required)
        elif label == "reviewed":
            good = (status == 1 and "PASS: single assignment" in passes and
                    any(line.startswith("FAIL: original PATH selects command, assigned PATH reaches child (")
                        for line in failures))
        elif label == "final":
            good = status == 0 and failed == 0
        else:
            raise SystemExit(f"Unknown comparison label: {label}")
        summary = f"### {label}: {checks - failed}/{checks} passed; exit {status}\n\n"
        summary += "\n".join(f"- {line}" for line in failures) + "\n\n"
        if os.environ.get("GITHUB_STEP_SUMMARY"):
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                output.write(summary)
        print(summary, end="")
        if not good:
            raise SystemExit(f"{label}: expected differential evidence was not obtained")


    if __name__ == "__main__":
        mode, *args = sys.argv[1:]
        if mode == "select-debs":
            select_debs(*args)
        elif mode == "run":
            raise SystemExit(run_with_timeout(args[0], args[1], args[2:]))
        elif mode == "report":
            report_suite(*args)
        else:
            raise SystemExit(f"Unknown mode: {mode}")

jobs:
  guest:
    if: github.repository == 'burdettadam/darling'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Qualify real Mach-O programs inside Darling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          harness="$RUNNER_TEMP/sudo-1388-harness"
          mkdir -p "$harness"
          printf '%s\n' "$QUALIFICATION_HELPER" >"$harness/qualification.py"
          cat >"$harness/run-linux.sh" <<'__DARLING_QUALIFICATION_SCRIPT__'
          #!/usr/bin/env bash
          set -euo pipefail
          ulimit -c 0

          source_dir=$(cd "$1" && pwd)
          harness=$(cd "$(dirname "$0")" && pwd)
          [[ ${SOURCE_SHA:?} =~ ^[0-9a-f]{40}$ ]]
          [[ $(git -C "$source_dir" rev-parse HEAD) == "$SOURCE_SHA" ]]
          work=$(mktemp -d "$RUNNER_TEMP/sudo-1388-guest.XXXXXX")
          export DPREFIX="$work/prefix"
          mkdir -p "$work/bin" "$work/logs" "$work/tmp" "$work/debs" "$work/linker"

          cleanup() {
              if command -v darling >/dev/null 2>&1; then
                  timeout -s KILL 30 darling shutdown </dev/null >"$work/logs/shutdown.log" 2>&1 || true
                  cat "$work/logs/shutdown.log"
              fi
              # The hosted VM discards this private prefix and the retained fixtures.
              # Never remove a prefix after an unsuccessful shutdown or run guest rm.
          }
          trap cleanup EXIT

          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libssl-dev git-lfs unzip file

          # Fetch only the recorded historical source revisions, never a moving branch.
          git -C "$source_dir" fetch --no-tags --depth=1 origin "$BASE_SHA" "$REVIEWED_SHA"
          git -C "$source_dir" show "$BASE_SHA:src/tools/sudo.c" >"$work/baseline.c"
          git -C "$source_dir" show "$REVIEWED_SHA:src/tools/sudo.c" >"$work/reviewed.c"

          # Sibling submodule repositories belong to darlinghq, not the fork owner.
          origin=$(git -C "$source_dir" remote get-url origin)
          git -C "$source_dir" remote set-url origin https://github.com/darlinghq/darling.git
          git -C "$source_dir" submodule sync --recursive
          git -C "$source_dir" submodule update --init --recursive --depth=1 --jobs=8
          git -C "$source_dir" remote set-url origin "$origin"

          # Published upstream runtime, not a source build or a host compatibility shim.
          # https://github.com/darlinghq/darling/actions/runs/45704448943
          gh api repos/darlinghq/darling/actions/artifacts/15065757973/zip >"$work/runtime.zip"
          printf '%s  %s\n' \
              310f92fe7e942265475680123dc8ab890ccace6acfabd30844ed10a9071c9c35 \
              "$work/runtime.zip" | sha256sum --check --strict
          unzip -q "$work/runtime.zip" -d "$work/debs"
          python3 "$harness/qualification.py" select-debs "$work/debs" >"$work/packages.list"
          mapfile -d '' -t packages <"$work/packages.list"
          [[ ${#packages[@]} -gt 0 ]]
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

          darling_root=/usr/libexec/darling
          linker="$darling_root/Library/Developer/DarlingCLT/usr/bin/ld"
          [[ -x "$linker" ]]
          ln -s "$linker" "$work/linker/ld"
          sdk="$source_dir/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          [[ -f "$sdk/usr/include/stdlib.h" ]]

          # Build only the project's small signing utility. The installed Darling package
          # already supplies its native ld64; a second linker or cold stack build is unnecessary.
          clang-18 -std=gnu11 -O0 \
              -I"$source_dir/src/buildtools/include" \
              -I"$source_dir/src/external/cctools-port/cctools/include" \
              "$source_dir/src/buildtools/adhoc-sign.c" -lcrypto -o "$work/adhoc-sign"

          # The source SDK + installed guest syslibroot match darling-guest-testing's
          # guest-cc.sh. Only the production C source differs between these executables.
          # https://github.com/darlinghq/darling-skills/blob/49e07ac6adfcbedc5a8d456489252178700fc7cc/darling-guest-testing/SKILL.md
          for label in baseline reviewed final; do
              file="$work/$label.c"
              [[ $label != final ]] || file="$source_dir/src/tools/sudo.c"
              clang-18 -target x86_64-apple-macos11.0 \
                  -D__DARWIN_ONLY_UNIX_CONFORMANCE=1 -isysroot "$sdk" -B "$work/linker" \
                  -Wl,-syslibroot,"$darling_root" -o "$work/bin/sudo-$label" "$file"
              "$work/adhoc-sign" "$work/bin/sudo-$label"
              /usr/bin/file "$work/bin/sudo-$label"
              sha256sum "$file" "$work/bin/sudo-$label"
          done

          {
              printf '## Real Darling guest qualification\n\n'
              printf 'Source `%s`; upstream baseline `%s`; reviewed branch `%s`.\n\n' "$SOURCE_SHA" "$BASE_SHA" "$REVIEWED_SHA"
              printf 'Runtime: upstream `%s`, DEB artifact `%s`.\n\n' bfd3cae463fd45a4cfd1b164d438e68b73e35ab6 15065757973
              printf 'Production sources cross-compiled with the pinned source SDK and linked to the installed Darling runtime. No UID/GID or execution shims. This is not a full CMake stack build.\n\n'
          } >>"$GITHUB_STEP_SUMMARY"

          # The launcher can require a second first-start attempt after a fresh shutdown.
          if ! timeout -s KILL 120 darling shell /bin/sh -c 'printf guest-ready' </dev/null >"$work/logs/start.log" 2>&1; then
              cat "$work/logs/start.log"
              timeout -s KILL 120 darling shell /bin/sh -c 'printf guest-ready' </dev/null >"$work/logs/start.log" 2>&1
          fi
          cat "$work/logs/start.log"

          for label in baseline reviewed final; do
              set +e
              timeout -s KILL 180 darling shell /bin/sh -c '
                  TMPDIR="$4" SUDO_TEST_KEEP=1 /bin/sh "$1" "$2"
                  result=$?
                  printf "%s\n" "$result" >"$3"
                  exit "$result"
              ' sh \
                  "/Volumes/SystemRoot$source_dir/tests/sudo-cli.sh" \
                  "/Volumes/SystemRoot$work/bin/sudo-$label" \
                  "/Volumes/SystemRoot$work/$label.status" \
                  "/Volumes/SystemRoot$work/tmp" \
                  </dev/null >"$work/logs/$label.log" 2>&1
              launcher_status=$?
              set -e
              cat "$work/logs/$label.log"
              [[ $launcher_status -lt 124 && -f "$work/$label.status" ]]
              python3 "$harness/qualification.py" report "$label" "$work/logs/$label.log" "$(cat "$work/$label.status")"
          done

          timeout -s KILL 120 darling shell "/Volumes/SystemRoot$work/bin/sudo-final" \
              -u 123 -g 456 DARLING_SUDO_TEST=guest-identity /bin/sh -c \
              '/usr/bin/id -u; /usr/bin/id -g; printf "%s\n" "$DARLING_SUDO_TEST"' \
              </dev/null >"$work/logs/identity.log" 2>"$work/logs/identity.err"
          cat "$work/logs/identity.log" "$work/logs/identity.err"
          [[ ! -s "$work/logs/identity.err" ]]
          printf '123\n456\nguest-identity\n' >"$work/identity.expected"
          cmp "$work/identity.expected" "$work/logs/identity.log"
          printf 'Guest identity and environment check passed: UID 123, GID 456, assigned value preserved.\n' >>"$GITHUB_STEP_SUMMARY"
          __DARLING_QUALIFICATION_SCRIPT__
          bash "$harness/run-linux.sh" "$GITHUB_WORKSPACE/source"

  native:
    if: github.repository == 'burdettadam/darling'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Qualify native execvP and same-user sudo PATH behavior
        run: |
          harness="$RUNNER_TEMP/sudo-1388-harness"
          mkdir -p "$harness"
          printf '%s\n' "$QUALIFICATION_HELPER" >"$harness/qualification.py"
          cat >"$harness/run-macos.sh" <<'__DARLING_QUALIFICATION_SCRIPT__'
          #!/usr/bin/env bash
          set -euo pipefail
          ulimit -c 0

          source_dir=$(cd "$1" && pwd)
          harness=$(cd "$(dirname "$0")" && pwd)
          [[ ${SOURCE_SHA:?} =~ ^[0-9a-f]{40}$ ]]
          [[ $(git -C "$source_dir" rev-parse HEAD) == "$SOURCE_SHA" ]]
          work=$(mktemp -d "$RUNNER_TEMP/sudo-1388-native.XXXXXX")
          mkdir -p "$work/bin" "$work/logs" "$work/tmp" "$work/original" "$work/assigned"

          git -C "$source_dir" fetch --no-tags --depth=1 origin "$BASE_SHA" "$REVIEWED_SHA"
          git -C "$source_dir" show "$BASE_SHA:src/tools/sudo.c" >"$work/baseline.c"
          git -C "$source_dir" show "$REVIEWED_SHA:src/tools/sudo.c" >"$work/reviewed.c"
          cat >"$work/identity-shim.c" <<'EOF'
          #include <sys/types.h>
          int host_test_setuid(uid_t uid) { (void)uid; return 0; }
          int host_test_setgid(gid_t gid) { (void)gid; return 0; }
          EOF

          for label in baseline reviewed final; do
              file="$work/$label.c"
              [[ $label != final ]] || file="$source_dir/src/tools/sudo.c"
              /usr/bin/clang -arch x86_64 -mmacosx-version-min=11.0 \
                  -Dsetuid=host_test_setuid -Dsetgid=host_test_setgid \
                  "$file" "$work/identity-shim.c" -o "$work/bin/sudo-$label"
              /usr/bin/file "$work/bin/sudo-$label"
              shasum -a 256 "$file" "$work/bin/sudo-$label"
          done

          {
              printf '## Native macOS qualification\n\n'
              /usr/bin/sw_vers
              printf '\nSource `%s`; upstream baseline `%s`; reviewed branch `%s`.\n\n' "$SOURCE_SHA" "$BASE_SHA" "$REVIEWED_SHA"
              printf 'Real native execvP/setenv; only setuid/setgid are replaced with no-op test functions.\n\n'
          } >>"$GITHUB_STEP_SUMMARY"

          for label in baseline reviewed final; do
              set +e
              TMPDIR="$work/tmp" python3 "$harness/qualification.py" run "$work/logs/$label.log" 120 \
                  /bin/sh "$source_dir/tests/sudo-cli.sh" "$work/bin/sudo-$label"
              status=$?
              set -e
              cat "$work/logs/$label.log"
              python3 "$harness/qualification.py" report "$label" "$work/logs/$label.log" "$status"
          done

          # Black-box public-CLI oracle. The actual system sudo runs as the current
          # numeric user, never as root; -n forbids password prompts. No sudoers edits.
          runner_uid=$(/usr/bin/id -u)
          [[ $runner_uid != 0 ]]
          export LC_ALL=C
          native_sudo=(/usr/bin/sudo -n -u "#$runner_uid")
          /usr/bin/sudo -V >"$work/logs/sudo-version.log"
          cat "$work/logs/sudo-version.log"
          "${native_sudo[@]}" -- /usr/bin/true
          "${native_sudo[@]}" "PATH=$work/assigned" /usr/bin/printenv PATH >"$work/logs/child-path.log"
          printf '%s\n' "$work/assigned" >"$work/child-path.expected"
          cmp "$work/child-path.expected" "$work/logs/child-path.log"
          cat >"$work/assigned/true" <<'EOF'
          #!/bin/sh
          printf '%s\n' 'assigned-path-executable'
          exit 77
          EOF
          chmod +x "$work/assigned/true"
          set +e
          python3 "$harness/qualification.py" run "$work/logs/oracle.log" 30 \
              /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              "${native_sudo[@]}" "PATH=$work/assigned" true
          oracle_status=$?
          set -e
          cat "$work/logs/oracle.log"
          if [[ $oracle_status != 0 || -s "$work/logs/oracle.log" ]]; then
              printf 'Stock sudo oracle did not confirm the expected behavior (exit %s); inspect its policy/error output above. No policy changes were attempted.\n' "$oracle_status" >>"$GITHUB_STEP_SUMMARY"
              exit 1
          fi
          "${native_sudo[@]}" DARLING_SUDO_ORACLE_1388=value -- \
              /usr/bin/printenv DARLING_SUDO_ORACLE_1388 >"$work/logs/separator-positive.log"
          printf 'value\n' >"$work/separator-positive.expected"
          cmp "$work/separator-positive.expected" "$work/logs/separator-positive.log"
          missing_command="DARLING_SUDO_ORACLE_1388_${RANDOM}_${RANDOM}=value"
          set +e
          "${native_sudo[@]}" -- "$missing_command" /usr/bin/true \
              >"$work/logs/separator-negative.out" 2>"$work/logs/separator-negative.err"
          separator_status=$?
          set -e
          [[ $separator_status == 1 && ! -s "$work/logs/separator-negative.out" ]]
          grep -F -- "$missing_command" "$work/logs/separator-negative.err"
          printf 'Stock sudo oracle passed under the same host UID %s: command-line PATH reached the child without selecting the executable; -- stopped assignment parsing. The native policy may use secure_path.\n' "$runner_uid" >>"$GITHUB_STEP_SUMMARY"
          __DARLING_QUALIFICATION_SCRIPT__
          bash "$harness/run-macos.sh" "$GITHUB_WORKSPACE/source"

  installed:
    name: installed-${{ inputs.components || 'cli' }}
    if: github.repository == 'burdettadam/darling'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      BUILD_COMPONENTS: ${{ inputs.components || 'cli' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Build, install and compare the normal component configuration
        run: |
          set -euo pipefail
          ulimit -c 0
          case "$BUILD_COMPONENTS" in cli|stock) ;; *) exit 1 ;; esac
          source_dir="$GITHUB_WORKSPACE/source"
          work=$(mktemp -d "$RUNNER_TEMP/sudo-1388-$BUILD_COMPONENTS.XXXXXX")
          build="$work/build"
          prefix=/opt/darling-1388
          launcher="$prefix/bin/darling"
          active_prefix=
          mkdir -p "$work/logs"
          printf '%s\n' "$QUALIFICATION_HELPER" >"$work/qualification.py"
          [[ $SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $(git -C "$source_dir" rev-parse HEAD) == "$SOURCE_SHA" ]]
          [[ ! -e "$prefix" ]]

          # This job owns its installation and prefixes. Never remove mounted
          # guest files; the disposable VM discards them after shutdown.
          cleanup() {
              if [[ -n "$active_prefix" && -x "$launcher" ]]; then
                  DPREFIX="$active_prefix" timeout -s KILL 30 "$launcher" shutdown \
                      </dev/null >"$work/logs/final-shutdown.log" 2>&1 || true
                  cat "$work/logs/final-shutdown.log"
              fi
          }
          trap cleanup EXIT

          # cli is the complete upstream profile that owns sudo. The stock
          # baseline currently fails in QuartzCore against its pinned Indium;
          # retain stock as an explicit option without changing those sources.
          printf 'Normal component profile: `%s`.\n\n' "$BUILD_COMPONENTS" >>"$GITHUB_STEP_SUMMARY"
          swift_cmake=()
          if [[ $BUILD_COMPONENTS == cli ]]; then
              printf 'This qualifies the CLI configuration. The separate [stock baseline attempt](https://github.com/burdettadam/darling/actions/runs/46110462469/job/140872613272) failed to build QuartzCore against the pinned Indium before installation.\n\n' >>"$GITHUB_STEP_SUMMARY"
              # Automatic overlay compilation currently links CoreGraphics even
              # though that framework is outside the CLI profile. OFF is the
              # supported optional-overlay setting; prebuilt runtime installation
              # and the independent swift_toolchain CTest remain enabled.
              swift_cmake=(-DSWIFT_TOOLCHAIN=OFF)
              printf 'Optional Swift SDK overlay compilation is disabled with `SWIFT_TOOLCHAIN=OFF`; the bundled runtime installation remains enabled. The [CLI baseline with automatic overlays](https://github.com/burdettadam/darling/actions/runs/46114979799/job/140886653367) failed to link the excluded CoreGraphics framework. This run does not qualify those optional overlays.\n\n' >>"$GITHUB_STEP_SUMMARY"
          fi

          # Keep compiler warnings out of the live log, while preserving the
          # command status and printing error context if a build or install fails.
          run_logged() {
              local log="$work/logs/$1.log" status
              shift
              printf 'Running %s; detailed output: %s\n' "$*" "$log"
              if "$@" >"$log" 2>&1; then
                  tail -n 10 "$log"
              else
                  status=$?
                  grep -n -m 10 -B 4 -A 8 -E ': (fatal )?error:|CMake Error|undefined reference|No space left|Killed|Error [0-9]+' "$log" || true
                  tail -n 40 "$log"
                  return "$status"
              fi
          }

          # Reclaim unused SDKs on this disposable standard runner, preserving
          # the Clang/LLVM/Swift toolchains used by Darling's normal build.
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              devscripts equivs debhelper git-lfs automake xdg-user-dirs
          (cd "$source_dir" && sudo mk-build-deps -i -r \
              -t 'apt-get --no-install-recommends -y' debian/control)
          sudo apt-get clean

          git -C "$source_dir" fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -C "$source_dir" diff --name-only "$BASE_SHA" "$SOURCE_SHA" >"$work/changed-files"
          printf 'src/tools/sudo.c\ntests/sudo-cli.sh\n' >"$work/expected-files"
          cmp "$work/expected-files" "$work/changed-files"
          cp "$source_dir/tests/sudo-cli.sh" "$work/sudo-cli.sh"

          origin=$(git -C "$source_dir" remote get-url origin)
          git -C "$source_dir" remote set-url origin https://github.com/darlinghq/darling.git
          git -C "$source_dir" submodule sync --recursive
          git -C "$source_dir" submodule update --init --recursive --depth=1 --jobs=8
          # The small direct-build job skips LFS. A normal complete build needs
          # its actual sources and fixtures, so materialize them explicitly.
          unset GIT_LFS_SKIP_SMUDGE
          git -C "$source_dir" lfs pull
          git -C "$source_dir" submodule foreach --recursive 'git lfs pull'
          git -C "$source_dir" remote set-url origin "$origin"
          df -h "$GITHUB_WORKSPACE"
          free_bytes=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          if (( free_bytes < 18 * 1024 * 1024 * 1024 )); then
              echo 'Insufficient free disk for the documented full build/install budget.' >&2
              exit 1
          fi

          # No source or build-system changes other than the sudo fix enter
          # this comparison. Keep the final regression script outside the tree.
          git -C "$source_dir" checkout --detach "$BASE_SHA"

          stop_guest() {
              DPREFIX="$active_prefix" timeout -s KILL 60 "$launcher" shutdown \
                  </dev/null >"$work/logs/shutdown-$1.log" 2>&1
              cat "$work/logs/shutdown-$1.log"
              # Shutdown can return while a loader/server survives. Check only
              # executables from this job's unique installation before replacing it.
              sudo python3 - "$prefix" <<'PY'
          import os
          from pathlib import Path
          import sys
          prefix = sys.argv[1] + "/"
          survivors = []
          for entry in Path("/proc").iterdir():
              if not entry.name.isdigit():
                  continue
              try:
                  executable = os.readlink(entry / "exe").removesuffix(" (deleted)")
              except (FileNotFoundError, ProcessLookupError):
                  continue
              if executable.startswith(prefix):
                  survivors.append((entry.name, executable))
          if survivors:
              raise SystemExit(f"Darling processes survived shutdown: {survivors}")
          PY
              active_prefix=
          }

          for label in baseline final; do
              if [[ $label == final ]]; then
                  git -C "$source_dir" checkout --detach "$SOURCE_SHA"
              fi
              printf '::group::%s normal %s build and installation\n' "$label" "$BUILD_COMPONENTS"
              env CFLAGS= CXXFLAGS= CPPFLAGS= LDFLAGS= OBJCFLAGS= OBJCXXFLAGS= \
                  cmake -S "$source_dir" -B "$build" -G 'Unix Makefiles' \
                  -DCMAKE_INSTALL_PREFIX="$prefix" -DCOMPONENTS="$BUILD_COMPONENTS" \
                  -DDARLING_ARCHS=x86_64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  "${swift_cmake[@]}" \
                  -DDARLING_SWIFT_WMO=ON -DDARLING_NO_CCACHE=ON \
                  -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++
              run_logged "$label-sudo" cmake --build "$build" --target sudo --parallel 4
              run_logged "$label-build" cmake --build "$build" --parallel 4
              run_logged "$label-install" sudo cmake --install "$build"
              [[ $(stat -c '%u %g %a' "$launcher") == '0 0 4755' ]]
              cmp "$build/src/tools/sudo" "$prefix/libexec/darling/usr/bin/sudo"
              sha256sum "$source_dir/src/tools/sudo.c" "$build/src/tools/sudo" \
                  "$prefix/libexec/darling/usr/bin/sudo"
              printf '::endgroup::\n'

              # CTest includes the installed signing check. Record the complete
              # baseline, including existing skips/failures, before comparing.
              printf '::group::%s registered CTest regressions\n' "$label"
              ctest --test-dir "$build" --show-only=json-v1 >"$work/ctest-$label.json"
              set +e
              ctest --test-dir "$build" --output-on-failure --no-tests=error \
                  --timeout 180 --output-junit "$work/ctest-$label.xml" \
                  >"$work/logs/ctest-$label.log" 2>&1
              ctest_status=$?
              set -e
              printf '%s\n' "$ctest_status" >"$work/ctest-$label.status"
              cat "$work/logs/ctest-$label.log"
              printf '::endgroup::\n'

              printf '::group::%s installed sudo guest regressions\n' "$label"
              active_prefix="$work/prefix-$label"
              export DPREFIX="$active_prefix"
              mkdir -p "$work/fixtures-$label"
              if ! timeout -s KILL 120 "$launcher" shell /bin/sh -c 'printf guest-ready' \
                      </dev/null >"$work/logs/start-$label.log" 2>&1; then
                  cat "$work/logs/start-$label.log"
                  timeout -s KILL 120 "$launcher" shell /bin/sh -c 'printf guest-ready' \
                      </dev/null >"$work/logs/start-$label.log" 2>&1
              fi
              cat "$work/logs/start-$label.log"
              timeout -s KILL 120 "$launcher" shell /bin/cat /usr/bin/sudo \
                  </dev/null >"$work/guest-sudo-$label" 2>"$work/logs/guest-sudo-$label.err"
              [[ ! -s "$work/logs/guest-sudo-$label.err" ]]
              cmp "$prefix/libexec/darling/usr/bin/sudo" "$work/guest-sudo-$label"
              set +e
              timeout -s KILL 180 "$launcher" shell /bin/sh -c '
                  cd / || exit 2
                  TMPDIR="$2" SUDO_TEST_KEEP=1 /bin/sh "$1" /usr/bin/sudo
                  result=$?
                  printf "%s\n" "$result" >"$3"
                  exit "$result"
              ' sh "/Volumes/SystemRoot$work/sudo-cli.sh" \
                  "/Volumes/SystemRoot$work/fixtures-$label" \
                  "/Volumes/SystemRoot$work/suite-$label.status" \
                  </dev/null >"$work/logs/suite-$label.log" 2>&1
              launcher_status=$?
              set -e
              cat "$work/logs/suite-$label.log"
              [[ $launcher_status -lt 124 && -f "$work/suite-$label.status" ]]
              python3 "$work/qualification.py" report "$label" \
                  "$work/logs/suite-$label.log" "$(cat "$work/suite-$label.status")"
              if [[ $label == final ]]; then
                  timeout -s KILL 120 "$launcher" shell /usr/bin/sudo \
                      -u 123 -g 456 DARLING_SUDO_TEST=guest-identity /bin/sh -c \
                      '/usr/bin/id -u; /usr/bin/id -g; printf "%s\n" "$DARLING_SUDO_TEST"' \
                      </dev/null >"$work/identity.log" 2>"$work/identity.err"
                  cat "$work/identity.log" "$work/identity.err"
                  [[ ! -s "$work/identity.err" ]]
                  printf '123\n456\nguest-identity\n' >"$work/identity.expected"
                  cmp "$work/identity.expected" "$work/identity.log"
              fi
              stop_guest "$label"
              printf '::endgroup::\n'
          done

          python3 - "$work" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          work = Path(sys.argv[1])
          results = {}
          summaries = []
          for label in ("baseline", "final"):
              inventory = json.loads((work / f"ctest-{label}.json").read_text())
              expected = {test["name"] for test in inventory["tests"]}
              cases = ET.parse(work / f"ctest-{label}.xml").getroot().findall(".//testcase")
              states = {}
              for case in cases:
                  name = case.attrib["name"]
                  if name in states:
                      raise SystemExit(f"{label}: duplicate CTest result {name}")
                  states[name] = ("failed" if case.find("failure") is not None or case.find("error") is not None
                                  else "skipped" if case.find("skipped") is not None else "passed")
              status = int((work / f"ctest-{label}.status").read_text())
              if not expected or set(states) != expected or status not in (0, 8):
                  raise SystemExit(f"{label}: incomplete CTest run; exit {status}")
              if (status == 0) != ("failed" not in states.values()):
                  raise SystemExit(f"{label}: inconsistent CTest exit status")
              results[label] = states
              counts = {state: sum(value == state for value in states.values())
                        for state in ("passed", "failed", "skipped")}
              summaries.append(f"### CTest {label}: {counts}; exit {status}\n")
              summaries.extend(f"- {name}: {state}\n" for name, state in sorted(states.items())
                               if state != "passed")
          before, after = results["baseline"], results["final"]
          if set(before) != set(after):
              raise SystemExit("CTest registration changed between the baseline and final build")
          regressions = {name: (before[name], state) for name, state in after.items()
                         if state != "passed" and state != before[name]}
          report = "\n".join(summaries)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(report)
          if regressions:
              raise SystemExit(f"New CTest regressions: {regressions}")
          PY
          git -C "$source_dir" diff --exit-code -- src/tools/sudo.c tests/sudo-cli.sh
          {
              printf '\n## Normal build/install qualification\n\n'
              printf 'Source `%s`; upstream baseline `%s`.\n\n' "$SOURCE_SHA" "$BASE_SHA"
              printf 'Complete `%s` x86_64 CMake build and normal installation completed before and after the fix. The final build reused the baseline build tree incrementally.\n\n' "$BUILD_COMPONENTS"
              printf 'Both phases compared the built binary with the installation and with guest `/usr/bin/sudo`. The installed final executable passed the regression suite and UID/GID/environment probe.\n\n'
              printf 'CTest was compared by test name and status; any existing failures/skips are reported above. No additional CTest regressions.\n'
          } >>"$GITHUB_STEP_SUMMARY"

