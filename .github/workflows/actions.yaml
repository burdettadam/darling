# CI branch only: replace .github/workflows/actions.yaml on
# ci/1388-installed-tools. Keep this workflow out of the upstream fix.
name: Sudo 1388 installed tools

on:
  push:
    branches: [ci/1388-installed-tools]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character production commit to qualify
        required: false
        default: 95bd9b12fb2f402fc3a3fc31872d35558a603169
        type: string

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: ${{ inputs.source_sha || '95bd9b12fb2f402fc3a3fc31872d35558a603169' }}
  BASE_SHA: c97ed9e7d4aaacb307acfd109c9b6cad77dc0016
  GIT_LFS_SKIP_SMUDGE: '1'
  QUALIFICATION_HELPER: |
    #!/usr/bin/env python3
    """Helpers for the isolated sudo qualification workflow, not product code."""

    import email.parser
    import os
    from pathlib import Path
    import re
    import signal
    import subprocess
    import sys


    def select_debs(directory):
        """Select CLI runtime packages and their local Darling dependencies."""
        packages = {}
        for path in sorted(Path(directory).rglob("*.deb")):
            control = subprocess.check_output(["dpkg-deb", "--field", str(path)], text=True)
            fields = email.parser.Parser().parsestr(control)
            if fields["Architecture"] not in ("all", "amd64"):
                continue
            name = fields["Package"]
            if name in packages:
                raise SystemExit(f"Multiple candidate packages for {name}")
            packages[name] = (path, fields)
        selected = set()
        pending = ["darling-core-native", "darling-core", "darling-system", "darling-cli"]
        while pending:
            name = pending.pop()
            if name in selected:
                continue
            if name not in packages:
                raise SystemExit(f"Pinned artifact is missing required package {name}")
            selected.add(name)
            _, fields = packages[name]
            dependencies = fields.get("Depends", "") + "," + fields.get("Pre-Depends", "")
            for group in dependencies.split(","):
                # The local packages have simple dependencies. Include any Darling
                # alternative from this same artifact; apt checks version constraints.
                for alternative in group.split("|"):
                    match = re.match(r"\s*([a-z0-9][a-z0-9+.-]*)", alternative)
                    if match and match[1].startswith("darling"):
                        pending.append(match[1])
        for name in sorted(selected):
            path, fields = packages[name]
            print(f"Runtime: {name} {fields['Version']} {fields['Architecture']}", file=sys.stderr)
            sys.stdout.buffer.write(os.fsencode(path.resolve()) + b"\0")


    def run_with_timeout(log, seconds, command):
        """Bound a native macOS subprocess and its own children, with no timeout dependency."""
        with open(log, "wb") as output:
            process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=output,
                                       stderr=subprocess.STDOUT, start_new_session=True)
            try:
                return process.wait(timeout=int(seconds))
            except subprocess.TimeoutExpired:
                os.killpg(process.pid, signal.SIGKILL)
                process.wait()
                return 124


    def report_suite(label, logfile, status):
        text = Path(logfile).read_text(errors="replace")
        lines = text.splitlines()
        passes = [line for line in lines if line.startswith("PASS: ")]
        failures = [line for line in lines if line.startswith("FAIL: ")]
        summaries = re.findall(r"(?m)^(\d+) checks, (\d+) failures$", text)
        status = int(status)
        if not summaries:
            raise SystemExit(f"{label}: suite did not complete; status={status}")
        checks, failed = map(int, summaries[-1])
        if checks != len(passes) + len(failures) or failed != len(failures) or checks == 0:
            raise SystemExit(f"{label}: inconsistent test accounting")
        if "PASS: ordinary command" not in passes:
            raise SystemExit(f"{label}: basic execution failed; not a valid before/after comparison")
        if label == "baseline":
            required = ("FAIL: single assignment (", "FAIL: HOME assignment from issue 1388 (")
            good = status == 1 and all(any(line.startswith(prefix) for line in failures)
                                       for prefix in required)
        elif label == "reviewed":
            good = (status == 1 and "PASS: single assignment" in passes and
                    any(line.startswith("FAIL: original PATH selects command, assigned PATH reaches child (")
                        for line in failures))
        elif label == "final":
            good = status == 0 and failed == 0
        else:
            raise SystemExit(f"Unknown comparison label: {label}")
        summary = f"### {label}: {checks - failed}/{checks} passed; exit {status}\n\n"
        summary += "\n".join(f"- {line}" for line in failures) + "\n\n"
        if os.environ.get("GITHUB_STEP_SUMMARY"):
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                output.write(summary)
        print(summary, end="")
        if not good:
            raise SystemExit(f"{label}: expected differential evidence was not obtained")


    if __name__ == "__main__":
        mode, *args = sys.argv[1:]
        if mode == "select-debs":
            select_debs(*args)
        elif mode == "run":
            raise SystemExit(run_with_timeout(args[0], args[1], args[2:]))
        elif mode == "report":
            report_suite(*args)
        else:
            raise SystemExit(f"Unknown mode: {mode}")

jobs:
  normal-tools-install:
    if: github.repository == 'burdettadam/darling'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Build and install normal CLI tools into the pinned runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -c 0
          source_dir="$GITHUB_WORKSPACE/source"
          work=$(mktemp -d "$RUNNER_TEMP/sudo-1388-tools.XXXXXX")
          build="$work/build"
          darling_root=/usr/libexec/darling
          launcher=/usr/bin/darling
          active_prefix=
          label=setup
          mkdir -p "$work/logs" "$work/debs"
          printf '%s\n' "$QUALIFICATION_HELPER" >"$work/qualification.py"
          [[ $SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $(git -C "$source_dir" rev-parse HEAD) == "$SOURCE_SHA" ]]
          [[ ! -e "$launcher" && ! -e "$darling_root" ]]

          # Preserve the guest's own diagnostics before stopping a failed run.
          # Server and launchd stdio detach during bootstrap, so the launcher
          # output alone does not contain every startup failure.
          collect_guest_logs() {
              local name log
              [[ -n "$active_prefix" ]] || return 0
              for name in dserver.log shellspawn.log launchd-pid1.crash; do
                  log="$active_prefix/private/var/log/$name"
                  printf '\nGuest diagnostic: %s\n' "$log"
                  if [[ -f "$log" && ! -L "$log" ]]; then
                      if tail -c 65536 "$log" >"$work/logs/$label-$name"; then
                          cat "$work/logs/$label-$name"
                      else
                          printf 'Could not read guest diagnostic.\n'
                      fi
                  else
                      printf 'No regular diagnostic file at this path.\n'
                  fi
              done
          }

          finish() {
              local status=$1 shutdown_status
              trap - EXIT
              if [[ -n "$active_prefix" && -x "$launcher" ]]; then
                  if (( status != 0 )); then
                      collect_guest_logs || true
                  fi
                  if DPREFIX="$active_prefix" timeout -s KILL 30 "$launcher" shutdown \
                          </dev/null >"$work/logs/cleanup-$label.log" 2>&1; then
                      shutdown_status=0
                  else
                      shutdown_status=$?
                  fi
                  printf 'Cleanup shutdown exit: %s\n' "$shutdown_status"
                  cat "$work/logs/cleanup-$label.log"
                  if (( status == 0 && shutdown_status != 0 )); then
                      status=$shutdown_status
                  fi
              fi
              # The disposable VM discards owned prefixes and retained fixtures.
              # Never remove mounted guest files or run rm inside Darling.
              exit "$status"
          }
          trap 'finish $?' EXIT

          # Keep long builds readable without hiding a non-zero command status.
          run_logged() {
              local name=$1 log command_pid progress_pid status
              shift
              log="$work/logs/$name.log"
              printf 'Running %s; detailed output: %s\n' "$*" "$log"
              "$@" >"$log" 2>&1 &
              command_pid=$!
              (
                  while sleep 60; do
                      kill -0 "$command_pid" 2>/dev/null || break
                      printf 'Build/install progress (%s): ' "$name"
                      tail -n 1 "$log" | cut -c 1-240
                  done
              ) &
              progress_pid=$!
              if wait "$command_pid"; then
                  status=0
              else
                  status=$?
              fi
              kill "$progress_pid" 2>/dev/null || true
              wait "$progress_pid" 2>/dev/null || true
              if (( status == 0 )); then
                  tail -n 10 "$log"
              else
                  grep -n -m 10 -B 4 -A 8 -E ': (fatal )?error:|CMake Error|undefined reference|No space left|Killed|Error [0-9]+' "$log" || true
                  tail -n 40 "$log"
              fi
              return "$status"
          }

          assert_runtime_stopped() {
              # /usr is shared with the host. Match only these runtime binaries,
              # not every executable below the installation prefix.
              sudo -n python3 - "$darling_root" "$launcher" <<'PY_STOP'
          import os
          from pathlib import Path
          import sys
          root = sys.argv[1] + "/"
          launcher = Path(sys.argv[2])
          owned = {os.path.realpath(launcher),
                   os.path.realpath(launcher.with_name("darlingserver"))}
          survivors = []
          for entry in Path("/proc").iterdir():
              if not entry.name.isdigit():
                  continue
              try:
                  executable = os.readlink(entry / "exe").removesuffix(" (deleted)")
              except (FileNotFoundError, ProcessLookupError):
                  continue
              if executable in owned or executable.startswith(root):
                  survivors.append((entry.name, executable))
          if survivors:
              raise SystemExit(f"Darling processes survived shutdown: {survivors}")
          PY_STOP
          }

          stop_guest() {
              local reason=$1 status
              if [[ -n "$active_prefix" ]]; then
                  if DPREFIX="$active_prefix" timeout -s KILL 60 "$launcher" shutdown \
                          </dev/null >"$work/logs/shutdown-$reason.log" 2>&1; then
                      status=0
                  else
                      status=$?
                  fi
                  printf 'Shutdown %s exit: %s\n' "$reason" "$status"
                  cat "$work/logs/shutdown-$reason.log"
                  (( status == 0 )) || return "$status"
              fi
              assert_runtime_stopped
              active_prefix=
          }

          start_guest() {
              local attempt status log
              for attempt in 1 2; do
                  log="$work/logs/start-$label-attempt$attempt.log"
                  if DPREFIX="$active_prefix" timeout -s KILL 120 "$launcher" shell \
                          /bin/sh -c 'printf guest-ready' </dev/null >"$log" 2>&1; then
                      status=0
                  else
                      status=$?
                  fi
                  printf '%s\n' "$status" >"$work/start-$label-attempt$attempt.status"
                  printf 'Startup %s attempt %s exit: %s\n' "$label" "$attempt" "$status"
                  cat "$log"
                  printf '\n'
                  if (( status == 0 )); then
                      return 0
                  fi
              done
              return "$status"
          }

          {
              printf '## Normal CMake tools on a pinned upstream runtime\n\n'
              printf 'Source `%s`; baseline `%s`.\n\n' "$SOURCE_SHA" "$BASE_SHA"
              printf 'Runtime: upstream `bfd3cae463fd45a4cfd1b164d438e68b73e35ab6`, DEB artifact `15065757973`.\n\n'
              printf 'This is incremental target build/install qualification: `COMPONENTS=cli`, `SWIFT_TOOLCHAIN=OFF`, x86_64, RelWithDebInfo, install prefix `/usr`. Only the generated `src/tools` directory installer is used; newly built runtime dependencies are not installed.\n\n'
              printf 'The [separate full stock attempt](https://github.com/burdettadam/darling/actions/runs/46119442854/job/140900474152) built and installed the baseline with Metal disabled, then passed 93/95 registered CTest tests (the two packaging tests failed). Its guest startup failed before the final phase. This run does not replace that result or claim final whole-stack/CTest qualification.\n\n'
              printf 'Installation follows the [upstream incremental testing recipe](https://github.com/darlinghq/darling-skills/blob/cb68fc887ec7bef844aaf027f8f0538d80a13f24/darling-guest-testing/scripts/rebuild.sh).\n\n'
          } >>"$GITHUB_STEP_SUMMARY"

          # This is a fresh standard hosted VM; preserve its Clang/LLVM toolchain.
          df -h "$GITHUB_WORKSPACE"
          sudo -n rm -rf /usr/share/dotnet /usr/local/lib/android
          export DEBIAN_FRONTEND=noninteractive
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends \
              devscripts equivs debhelper git-lfs automake xdg-user-dirs unzip file
          (cd "$source_dir" && sudo -n mk-build-deps -i -r \
              -t 'apt-get --no-install-recommends -y' debian/control)
          sudo -n apt-get clean

          git -C "$source_dir" fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -C "$source_dir" diff --name-only "$BASE_SHA" "$SOURCE_SHA" >"$work/changed-files"
          printf 'src/tools/sudo.c\ntests/sudo-cli.sh\n' >"$work/expected-files"
          cmp "$work/expected-files" "$work/changed-files"
          cp "$source_dir/tests/sudo-cli.sh" "$work/sudo-cli.sh"
          origin=$(git -C "$source_dir" remote get-url origin)
          git -C "$source_dir" remote set-url origin https://github.com/darlinghq/darling.git
          git -C "$source_dir" submodule sync --recursive
          git -C "$source_dir" submodule update --init --recursive --depth=1 --jobs=8
          unset GIT_LFS_SKIP_SMUDGE
          git -C "$source_dir" lfs pull
          git -C "$source_dir" submodule foreach --recursive 'git lfs pull'
          git -C "$source_dir" remote set-url origin "$origin"

          # Use the identical published package set and checksum as the passing
          # focused guest job. No source or dependency revision is patched.
          gh api repos/darlinghq/darling/actions/artifacts/15065757973/zip >"$work/runtime.zip"
          unset GH_TOKEN
          printf '%s  %s\n' \
              310f92fe7e942265475680123dc8ab890ccace6acfabd30844ed10a9071c9c35 \
              "$work/runtime.zip" | sha256sum --check --strict
          unzip -q "$work/runtime.zip" -d "$work/debs"
          python3 "$work/qualification.py" select-debs "$work/debs" >"$work/packages.list"
          [[ -s "$work/packages.list" ]]
          mapfile -d '' -t packages <"$work/packages.list"
          sudo -n apt-get install -y --no-install-recommends "${packages[@]}"
          [[ $(stat -c '%u %g %a' "$launcher") == '0 0 4755' ]]
          sha256sum "$launcher" /usr/bin/darlingserver \
              "$darling_root/usr/libexec/darling/mldr" "$darling_root/usr/lib/dyld" \
              "$darling_root/usr/lib/libSystem.B.dylib" \
              "$darling_root/usr/lib/system/libsystem_c.dylib" >"$work/runtime.sha256"
          df -h "$GITHUB_WORKSPACE"
          free_bytes=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)
          (( free_bytes >= 18 * 1024 * 1024 * 1024 ))

          # Separate package/environment startup from any effects of installing
          # the source-built tools. Use a fresh prefix and verify shutdown.
          label=runtime-smoke
          active_prefix="$work/prefix-runtime-smoke"
          start_guest
          stop_guest runtime-smoke
          printf 'Pinned-runtime smoke boot and verified shutdown passed before source-built tools were installed.\n\n' >>"$GITHUB_STEP_SUMMARY"

          tool_targets=(sw_vers system_profiler sudo codesign dsmemberutil softwareupdate spctl darpath)
          for label in baseline final; do
              if [[ $label == baseline ]]; then
                  phase_sha=$BASE_SHA
              else
                  phase_sha=$SOURCE_SHA
              fi
              git -C "$source_dir" checkout --detach "$phase_sha"
              [[ $(git -C "$source_dir" rev-parse HEAD) == "$phase_sha" ]]
              printf '::group::%s normal tools build and directory installation\n' "$label"
              env CFLAGS= CXXFLAGS= CPPFLAGS= LDFLAGS= OBJCFLAGS= OBJCXXFLAGS= \
                  cmake -S "$source_dir" -B "$build" -G 'Unix Makefiles' \
                  -DCMAKE_INSTALL_PREFIX=/usr -DCOMPONENTS=cli \
                  -DSWIFT_TOOLCHAIN=OFF -DDARLING_ARCHS=x86_64 \
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDARLING_NO_CCACHE=ON \
                  -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++
              # All eight share one generated installer. Building every sibling
              # satisfies its file rules without building unrelated CLI programs.
              run_logged "$label-build" cmake --build "$build" \
                  --target "${tool_targets[@]}" --parallel 4
              stop_guest "$label-before-install"
              (cd "$build/src/tools" && run_logged "$label-install" \
                  sudo -n cmake -P cmake_install.cmake)
              sha256sum --check --strict "$work/runtime.sha256"
              cmp "$build/src/tools/sudo" "$darling_root/usr/bin/sudo"
              sha256sum "$source_dir/src/tools/sudo.c" "$build/src/tools/sudo" \
                  "$darling_root/usr/bin/sudo"
              printf 'Normal tools build and directory install passed for %s `%s`.\n\n' "$label" "$phase_sha" >>"$GITHUB_STEP_SUMMARY"
              printf '::endgroup::\n'

              printf '::group::%s installed sudo guest regressions\n' "$label"
              active_prefix="$work/prefix-$label"
              export DPREFIX="$active_prefix"
              mkdir -p "$work/fixtures-$label"
              start_guest
              if timeout -s KILL 120 "$launcher" shell /bin/cat /usr/bin/sudo \
                      </dev/null >"$work/guest-sudo-$label" 2>"$work/logs/guest-sudo-$label.err"; then
                  read_status=0
              else
                  read_status=$?
              fi
              cat "$work/logs/guest-sudo-$label.err"
              [[ $read_status == 0 && ! -s "$work/logs/guest-sudo-$label.err" ]]
              cmp "$darling_root/usr/bin/sudo" "$work/guest-sudo-$label"
              sha256sum "$work/guest-sudo-$label"

              set +e
              timeout -s KILL 180 "$launcher" shell /bin/sh -c '
                  cd / || exit 2
                  TMPDIR="$2" SUDO_TEST_KEEP=1 /bin/sh "$1" /usr/bin/sudo
                  result=$?
                  printf "%s\n" "$result" >"$3"
                  exit "$result"
              ' sh "/Volumes/SystemRoot$work/sudo-cli.sh" \
                  "/Volumes/SystemRoot$work/fixtures-$label" \
                  "/Volumes/SystemRoot$work/suite-$label.status" \
                  </dev/null >"$work/logs/suite-$label.log" 2>&1
              launcher_status=$?
              set -e
              printf 'Suite launcher exit: %s\n' "$launcher_status"
              cat "$work/logs/suite-$label.log"
              [[ $launcher_status -lt 124 && -f "$work/suite-$label.status" ]]
              grep -Eq '^49 checks, [0-9]+ failures$' "$work/logs/suite-$label.log"
              python3 "$work/qualification.py" report "$label" \
                  "$work/logs/suite-$label.log" "$(cat "$work/suite-$label.status")"
              if [[ $label == final ]]; then
                  [[ $launcher_status == 0 ]]
                  if timeout -s KILL 120 "$launcher" shell /usr/bin/sudo \
                          -u 123 -g 456 DARLING_SUDO_TEST=guest-identity /bin/sh -c \
                          '/usr/bin/id -u; /usr/bin/id -g; printf "%s\n" "$DARLING_SUDO_TEST"' \
                          </dev/null >"$work/identity.log" 2>"$work/identity.err"; then
                      identity_status=0
                  else
                      identity_status=$?
                  fi
                  printf 'Identity probe exit: %s\n' "$identity_status"
                  cat "$work/identity.log" "$work/identity.err"
                  [[ $identity_status == 0 && ! -s "$work/identity.err" ]]
                  printf '123\n456\nguest-identity\n' >"$work/identity.expected"
                  cmp "$work/identity.expected" "$work/identity.log"
              fi
              stop_guest "$label"
              printf '::endgroup::\n'
          done

          git -C "$source_dir" diff --exit-code -- src/tools/sudo.c tests/sudo-cli.sh
          {
              printf '\n## Incremental installed-target result\n\n'
              printf 'Both source revisions built with normal CMake dependencies and installed through the generated `src/tools` directory installer. Pinned runtime binaries and core libraries retained their recorded hashes.\n\n'
              printf 'Built, installed and guest `/usr/bin/sudo` bytes matched in each phase. The final installed executable passed all 49 regressions and the real UID 123/GID 456/environment probe. Baseline differential results are above.\n\n'
              printf 'Fresh prefixes were used for both phases, with verified shutdown before replacement. No whole-stack or final CTest success is claimed by this targeted run.\n'
          } >>"$GITHUB_STEP_SUMMARY"
